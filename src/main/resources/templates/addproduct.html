<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Добавить товар</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <link rel="stylesheet" href="/css/addproduct.css">
</head>
<body>

<div class="container">
  <div class="form-container">
    <h4 class="text-center mb-4 text-muted">Добавить товар</h4>
    <form th:action="@{/product/add}" th:object="${product}" method="post">
      <div class="mb-3">
        <label for="productName" class="form-label">Название</label>
        <div class="input-group">
          <span class="input-group-text bg-white form-icon"><i class="fa fa-tag"></i></span>
          <input type="text" id="productName" class="form-control" th:field="*{productName}" placeholder="Введите название" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="imageUrl" class="form-label">Ссылка на изображение</label>
        <div class="input-group">
          <span class="input-group-text bg-white form-icon"><i class="fa fa-image"></i></span>
          <input type="url" id="imageUrl" class="form-control" th:field="*{imageUrl}" placeholder="URL изображения" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="price" class="form-label">Цена (₽)</label>
        <div class="input-group">
          <span class="input-group-text bg-white form-icon"><i class="fa fa-ruble-sign"></i></span>
          <input type="number" id="price" class="form-control" th:field="*{price}" placeholder="Цена" step="0.01" min="0" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 mt-3">
        <i class="fa fa-plus me-1"></i> Добавить товар
      </button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
