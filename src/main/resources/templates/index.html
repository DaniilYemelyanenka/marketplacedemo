<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
  <meta charset="UTF-8">
  <title>Главная</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">


  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">


  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

  <link rel="stylesheet" href="/css/style.css">

</head>
<body>

<header th:replace="layout/header :: header"></header>

<!-- Main -->
<main class="container">
  <div class="row">
    <div class="col-md-4" th:each="product : ${products}">
      <div class="product-card mx-auto">
        <img th:src="@{${product.imageUrl}}" class="img-fluid" alt="Product Image">
        <h6 th:text="${product.productName}">Название товара</h6>
        <p class="text-muted" th:text="'₽' + ${product.price}">₽0.00</p>
        <form th:action="@{/cart/add}" method="post" class="mt-auto">
          <input type="hidden" name="productId" th:value="${product.id}">
          <button type="submit" class="btn btn-sm btn-primary w-100 mt-1" >
            <i class="fa fa-cart-plus me-1"></i> В корзину
          </button>
        </form>
      </div>
    </div>
  </div>
</main>

<!-- Footer -->
<footer th:replace="layout/footer::footer"></footer>

<!-- Bootstrap JS -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
