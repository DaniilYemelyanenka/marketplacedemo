<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Регистрация пользователя</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <style>
        body {
            background-color: #f8f9fa;
        }

        .register-form {
            max-width: 400px;
            margin: 60px auto;
            padding: 30px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.1);
        }

        .form-icon {
            position: absolute;
            top: 10px;
            left: 15px;
            color: #17a2b8;
        }

        .form-control {
            padding-left: 40px;
        }
    </style>
</head>
<body>

<div class="register-form">
    <h4 class="text-center mb-4 text-muted">Регистрация</h4>
    <form th:action="@{/user/add}" method="post" th:object="${user}">
        <div class="mb-3 position-relative">
            <i class="fa fa-user form-icon"></i>
            <input type="text" th:field="*{username}" class="form-control" placeholder="Имя пользователя" required>
        </div>


        <div class="mb-3 position-relative">
            <i class="fa fa-lock form-icon"></i>
            <input type="password" th:field="*{password}" class="form-control" placeholder="Пароль" required>
        </div>

        <div class="text-center">
            <button type="submit" class="btn btn-info text-white w-100">
                <i class="fa fa-user-plus me-1"></i> Зарегистрироваться
            </button>
        </div>
    </form>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
