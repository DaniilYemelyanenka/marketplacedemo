<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Корзина</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
</head>
<body class="d-flex flex-column min-vh-100">

<!-- Header -->
<header class="bg-light border-bottom py-3 mb-4 sticky-top">
    <div class="container d-flex justify-content-between align-items-center">
        <div class="logo text-muted">
            <i class="fa fa-store me-2"></i>Shop
        </div>
        <div>
            <a href="/" class="btn btn-outline-secondary btn-sm">
                <i class="fa fa-home me-1"></i> На главную
            </a>
        </div>
    </div>
</header>

<!-- Main Content -->
<main class="container flex-grow-1">
    <h4 class="mb-4">Ваша корзина</h4>

    <div th:if="${#lists.isEmpty(cart.items)}" class="alert alert-info">
        Корзина пуста.
    </div>

    <div th:unless="${#lists.isEmpty(cart.items)}">
        <table class="table table-sm align-middle">
            <thead>
            <tr class="table-light">
                <th>Товар</th>
                <th class="text-center">Цена</th>
                <th class="text-center">Кол-во</th>
                <th class="text-end">Сумма</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${cart.items}">
                <td th:text="${item.productName}">Название</td>
                <td class="text-center" th:text="${item.price} + ' ₽'">0 ₽</td>
                <td class="text-center" th:text="${item.quantity}">1</td>
                <td class="text-end" th:text="${item.totalPrice} + ' ₽'">0 ₽</td>
            </tr>
            </tbody>
            <tfoot>
            <tr class="table-light fw-bold">
                <td colspan="3" class="text-end">Итого:</td>
                <td class="text-end" th:text="${cart.total} + ' ₽'">0 ₽</td>
            </tr>
            </tfoot>
        </table>

        <div class="text-end mt-3">
            <form th:action="@{/order/create}" method="post">
                <button type="submit" class="btn btn-primary">
                    <i class="fa fa-check me-1"></i> Оформить заказ
                </button>
            </form>
        </div>
    </div>
</main>

<!-- Footer -->
<footer class="bg-light border-top mt-5 py-3 text-center text-muted small">
    <div class="container">
        <p>© 2025 Интернет-магазин Shop. Все права защищены.</p>
        <p>support@example.com | +7 (000) 123-45-67</p>
    </div>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
