<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Авторизация</title>


    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link rel="stylesheet" href="css/login.css">
</head>
<body>

<div class="container d-flex justify-content-center">
    <div class="login-container">
        <h3 class="text-center mb-4">Вход в систему</h3>
        <form th:action="@{/login}" method="post" th:object="${user}">
            <div class="mb-3 position-relative">
                <i class="fa fa-user form-icon"></i>
                <input type="text" th:field="*{username}" class="form-control" placeholder="Имя пользователя" required>
            </div>
            <div class="mb-3 position-relative">
                <i class="fa fa-lock form-icon"></i>
                <input type="password" th:field="*{password}" class="form-control" placeholder="Пароль" required>
            </div>
            <div class="text-center mb-3">
                <small class="text-muted">
                    Нет аккаунта?
                    <a th:href="@{/signin}" class="text-decoration-none">Зарегистрируйся</a>
                </small>
            </div>

            <button type="submit" class="btn btn-primary w-100">Войти</button>
        </form>
    </div>
</div>

<!-- Bootstrap JS (опционально) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
